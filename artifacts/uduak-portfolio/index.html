<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Uduak Essien — Senior Full Stack Engineer (Rails | React)</title>
    <meta name="description" content="Uduak Essien is a senior full stack engineer building enterprise Ruby on Rails and React applications. Based in Portugal, open to remote work worldwide." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#16120f" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("uduak-theme"); } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f8f5f0" : "#16120f";
      })();
    </script>
    <meta property="og:title" content="Uduak Essien — Senior Full Stack Engineer" />
    <meta property="og:description" content="Enterprise Rails and React applications, REST APIs and production reliability. Portugal, remote worldwide." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/uduak-portrait.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Uduak Essien — Senior Full Stack Engineer" />
    <meta name="twitter:description" content="Enterprise Rails and React applications, REST APIs and production reliability." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </body>
</html>
